# Portfolio (static site: React + Vite, served by nginx): checks, then its
# Docker image, then production. Same shape as the Tunispare apps' pipelines.
#
# Runs on every push to main and every pull request. Jobs run in order —
# check → security → image → release — and each starts only if the previous
# one passed.
#
#   check     type-check · build (with the prerender) · the built page has its content
#   security  secret scanning (Trivy, Gitleaks over the whole history), SAST (Semgrep),
#             Dockerfile misconfiguration, dependency vulnerabilities
#   image     Dockerfile lint → build → Trivy image scan → push to GHCR (main only)
#   release   main only: write the new image's SHA into Tunispare/tunispare-deploy,
#             whose deploy workflow puts it on the server
#
# Settings (Settings → Secrets and variables → Actions):
#   variable PUBLIC_SITE_URL          the site's address (default below)
#   variable RELEASE_APP_CLIENT_ID    } the « tunispare-release » GitHub App, the same
#   secret   RELEASE_APP_PRIVATE_KEY  } values as in the Tunispare app repositories
#   secret   DISCORD_DEPLOY_WEBHOOK_URL  optional: a failed run is posted to #deploys
# Without the two RELEASE_APP_* values the image is built but not released.
#
# The release key can change any production manifest in tunispare-deploy. It
# belongs in the `production` environment (Settings → Environments), allowed
# to the `main` branch only, not in the repository's secrets: a branch whose
# workflow was edited could read a repository secret, never this one.
#
# Third-party actions are pinned to a full commit SHA (the version is in the
# comment): a tag can be moved, a commit cannot.
name: Portfolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://moanesbbr.tunispare.com' }}

jobs:
  check:
    name: Type-check, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # tsc, the client bundle, the server bundle and the prerender.
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ env.PUBLIC_SITE_URL }}
      # The page must carry its content without JavaScript (SEO and AI crawlers),
      # and the generated files must name the right address.
      - name: The built page has its content
        run: |
          grep -q 'Moanes Ben Brahim, software engineer and founder of Tunispare' dist/index.html
          grep -q 'How I got here' dist/index.html
          grep -q "Sitemap: $PUBLIC_SITE_URL/sitemap.xml" dist/robots.txt
          grep -q "<loc>$PUBLIC_SITE_URL/</loc>" dist/sitemap.xml
          test -s dist/llms.txt
          grep -q '^Content-Signal: search=yes' dist/robots.txt
          test -s dist/index.md
          jq -e '.skills | length > 0' dist/.well-known/agent-skills/index.json > /dev/null
          jq -e '.entries | length > 0' dist/.well-known/ai-catalog.json > /dev/null

  security:
    name: Security (secrets, code, Dockerfile, dependencies)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Gitleaks reads every commit, not just the last one.
          fetch-depth: 0

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true
      - name: Date for the Trivy database cache
        id: date
        run: echo "today=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore the Trivy database
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.today }}
          restore-keys: trivy-db-

      - name: Committed secrets (any finding blocks)
        run: trivy fs --no-progress --scanners secret --exit-code 1 .
      # The whole history too: a key committed then deleted is still in git.
      # Gitleaks' own image, pinned by digest (v8.28.0).
      - name: Secrets in the whole history (Gitleaks, any finding blocks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 git /repo --no-banner --redact
      # SAST (static application security testing) with Semgrep CE, pinned by
      # digest (v1.180.0). An ERROR finding blocks.
      - name: SAST, code patterns (Semgrep, ERROR blocks)
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3 semgrep scan --metrics=off --error --severity ERROR --config p/typescript --config p/react --config p/secrets src scripts
      - name: Dockerfile misconfiguration (HIGH and CRITICAL block)
        run: trivy fs --no-progress --scanners misconfig --severity HIGH,CRITICAL --exit-code 1 .
      - name: Dependency vulnerabilities (CRITICAL with a fix blocks)
        run: trivy fs --no-progress --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 .
      - name: Dependency vulnerabilities (HIGH, listed in the summary)
        if: always()
        run: |
          trivy fs --no-progress --scanners vuln --severity HIGH --ignore-unfixed --exit-code 0 --format table --output trivy-deps-high.txt .
          {
            echo "### ${GITHUB_REPOSITORY#*/}: HIGH dependency vulnerabilities with a fix"
            echo '```'
            cat trivy-deps-high.txt 2>/dev/null || echo "none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Docker image
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      # ghcr.io/<owner>/<this repository>, lowercase as GHCR wants.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built into the runner first, so it can be scanned and tried before
      # anything is published.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:scan
          build-args: |
            VITE_SITE_URL=${{ env.PUBLIC_SITE_URL }}
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,mode=max,scope=portfolio

      # The container as production runs it: read-only, no privileges. It must
      # serve the page with its security and cache headers.
      - name: Try the image
        run: |
          docker run -d --name try --read-only --tmpfs /tmp --cap-drop ALL -p 8080:8080 "$IMAGE:scan"
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz > /dev/null 2>&1 && break; sleep 1; done
          curl -fsS -D headers.txt -o page.html http://127.0.0.1:8080/
          grep -q 'How I got here' page.html
          grep -qi '^content-security-policy:' headers.txt
          grep -qi '^cache-control: no-cache' headers.txt
          asset=$(grep -o '/assets/[^"]*\.js' page.html | head -n 1)
          curl -fsS -D - -o /dev/null "http://127.0.0.1:8080$asset" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nothing-here)" = 404 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/)" = 405 ]
          # A refused request carries the security headers too.
          curl -s -D - -o /dev/null -X POST http://127.0.0.1:8080/ | grep -qi '^content-security-policy:'
          # For AI agents: browsers get HTML with a Link header, a request for
          # markdown gets markdown, and the /.well-known/ files are served as
          # JSON to any origin, the skill matching its published digest.
          grep -qi '^content-type: text/html' headers.txt
          grep -qi '^link: .*rel="describedby"' headers.txt
          curl -fsS -D md-headers.txt -o page.md -H 'Accept: text/markdown' http://127.0.0.1:8080/
          grep -qi '^content-type: text/markdown' md-headers.txt
          grep -q '^# Moanes Ben Brahim' page.md
          curl -fsS -D wk-headers.txt -o /dev/null http://127.0.0.1:8080/.well-known/ai-catalog.json
          grep -qi '^content-type: application/json' wk-headers.txt
          grep -qi '^access-control-allow-origin: \*' wk-headers.txt
          skill=$(curl -fsS http://127.0.0.1:8080/.well-known/agent-skills/index.json | jq -r '.skills[0]')
          want=$(jq -r '.digest | sub("^sha256:"; "")' <<< "$skill")
          got=$(curl -fsS "http://127.0.0.1:8080$(jq -r '.url' <<< "$skill" | sed 's|^https\?://[^/]*||')" | sha256sum | cut -d' ' -f1)
          [ "$want" = "$got" ]
          docker rm -f try > /dev/null

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true
      - name: Date for the Trivy database cache
        id: date
        run: echo "today=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore the Trivy database
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.today }}
          restore-keys: trivy-db-

      - name: Scan the image (CRITICAL with a fix blocks)
        run: trivy image --no-progress --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:scan"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main only: the same image (from cache), with its SBOM and build
      # provenance attached, tagged with the commit and `latest`.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SITE_URL=${{ env.PUBLIC_SITE_URL }}
          cache-from: type=gha,scope=portfolio
          provenance: mode=max
          sbom: true

  release:
    name: Release to production
    # The image that just passed every check goes to production: its SHA is
    # written into tunispare-deploy (k3s/kustomization.yaml), and that commit
    # starts tunispare-deploy's deploy workflow. Main only.
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Its secrets are given to main only (see the header).
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check that releases are set up
        id: setup
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::notice::RELEASE_APP_CLIENT_ID (variable) or RELEASE_APP_PRIVATE_KEY (secret) missing: the image is built but not released."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Token for tunispare-deploy (one hour, contents only)
        id: app-token
        if: steps.setup.outputs.ready == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: Tunispare
          repositories: tunispare-deploy
          permission-contents: write

      - name: Check out tunispare-deploy
        if: steps.setup.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Tunispare/tunispare-deploy
          token: ${{ steps.app-token.outputs.token }}

      - name: Point production at this commit's image
        if: steps.setup.outputs.ready == 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_SHA::7}"   # the short SHA the image job tagged
          file=k3s/kustomization.yaml
          # First release: the portfolio is not in tunispare-deploy yet. Its
          # manifests are added by hand once (deploy/README.md), with this tag.
          if ! grep -q "name: $image\$" "$file"; then
            echo "::notice::$image is not listed in tunispare-deploy's $file yet. Add the manifests from deploy/ with newTag \"$tag\" (deploy/README.md)."
            exit 0
          fi
          # Quoted: an all-digit SHA would be read as a YAML number.
          sed -i "\|name: $image\$|{n;s|newTag: .*|newTag: \"$tag\"|}" "$file"
          grep -A1 "name: $image\$" "$file" | grep -q "newTag: \"$tag\""
          if git diff --quiet; then
            echo "Production already runs $tag."; exit 0
          fi
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          changes=$(jq -r '.[]? | "- " + (.message | split("\n")[0] | .[0:100]) + " (" + .author.name + ")"' \
            <<< "$COMMITS" 2>/dev/null | tail -n 10)
          git commit -qam "${GITHUB_REPOSITORY#*/}: release $tag" \
            -m "${changes:-- (no commit list: started by hand)}" \
            -m "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          # Another app may release at the same moment: replay on top of it.
          for _ in 1 2 3; do
            git push -q && { echo "Released $tag: see tunispare-deploy → Actions → Deploy."; exit 0; }
            git pull -q --rebase
          done
          echo "::error::Could not push to tunispare-deploy."; exit 1

  notify:
    name: Tell Discord if it failed
    needs: [check, security, image, release]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Post the failure to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          NEEDS: ${{ toJSON(needs) }}
          SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "DISCORD_DEPLOY_WEBHOOK_URL not set: nothing sent."; exit 0; }
          failed=$(jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(" · ")' <<< "$NEEDS")
          subject=$(printf '%s' "${COMMIT_MESSAGE:-(no message)}" | head -n 1 | cut -c1-200)
          jq -n --arg t "❌ CI failed · portfolio" --arg u "$RUN_URL" \
                --arg d "Failed at: **${failed:-unknown}**. Production keeps the previous version." \
                --arg c "\`${SHA:0:7}\` $subject" \
            '{username: "Tunispare CI", allowed_mentions: {parse: []},
              embeds: [{title: $t, url: $u, color: 15158332, description: $d,
                        fields: [{name: "Commit", value: $c, inline: false}]}]}' \
            | curl -fsS -m 15 -H 'Content-Type: application/json' -d @- "$WEBHOOK" > /dev/null \
            || echo "::warning::Discord unreachable"
