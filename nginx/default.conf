# The portfolio's web server: static files only.
#
# Caching, by how each file is named:
#   /assets/*            hashed by Vite (JS, CSS, fonts): cached one year, immutable
#   /img, /video, icons  fixed names: cached one week, then revalidated
#   HTML, txt, xml       never served stale: the browser asks each time (304 if unchanged)
#
# nginx drops the server-level add_header lines in any location that sets its
# own, so every location includes the security headers snippet again.

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown application/xml application/manifest+json;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # GET and HEAD only: there is nothing to post to.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ^~ : a path under /assets/ never falls through to the regex location below
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:webp|png|jpg|jpeg|ico|svg|mp4|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    # Hidden files are never served.
    location ~ /\. {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # One page: an unknown path is a 404, not a copy of the home page.
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
