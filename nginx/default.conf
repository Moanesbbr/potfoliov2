# The portfolio's web server: static files only.
#
# Caching, by how each file is named:
#   /assets/*            hashed by Vite (JS, CSS, fonts): cached one year, immutable
#   /img, /video, icons  fixed names: cached one week, then revalidated
#   HTML, txt, xml       never served stale: the browser asks each time (304 if unchanged)
#
# For AI agents (each checked by the image's CI test):
#   Accept: text/markdown on /   the page as markdown (dist/index.md), HTML stays the default
#   Link on /                    where the markdown, the facts and the agent files are (RFC 8288)
#   /.well-known/                the agent skills index and the AI catalog, readable cross-origin
#
# The security headers are included at server level, for the answers given
# before any location (405, hidden files), and again in every location that
# sets its own add_header: nginx then drops the server-level ones.

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown application/xml application/manifest+json;

# 1 when the client asks for markdown (an agent), 0 for browsers.
map $http_accept $wants_markdown {
    default           0;
    "~*text/markdown" 1;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css text/xml text/markdown application/javascript application/json;
    include /etc/nginx/snippets/security-headers.conf;

    # GET and HEAD only: there is nothing to post to.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Hidden files are never served. First of the regex locations: nginx uses
    # the first one that matches, so /.x.png can't reach the image rule.
    location ~ /\. {
        return 404;
    }

    # Agent discovery files. ^~ wins over the hidden-files rule above, for
    # this folder only. Public facts, so any origin may read them.
    location ^~ /.well-known/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        types {
            application/json json;
            text/markdown    md;
        }
        default_type text/plain;
        try_files $uri =404;
    }

    # The home page: HTML for browsers, markdown for agents that ask for it.
    location = / {
        if ($wants_markdown) {
            rewrite ^ /index.md last;
        }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept" always;
        add_header Link '</index.md>; rel="alternate"; type="text/markdown", </llms.txt>; rel="describedby"; type="text/markdown", </.well-known/agent-skills/index.json>; rel="describedby"; type="application/json", </.well-known/ai-catalog.json>; rel="ai-catalog"; type="application/json", </sitemap.xml>; rel="sitemap"; type="application/xml"' always;
        try_files /index.html =404;
    }

    location = /index.md {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept" always;
        types { }
        default_type text/markdown;
        try_files /index.md =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ^~ : a path under /assets/ never falls through to the regex location below
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:webp|png|jpg|jpeg|ico|svg|mp4|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # One page: an unknown path is a 404, not a copy of the home page.
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
