# Portfolio (moanesbbr.tunispare.com): a static site served by nginx.
# Copy to tunispare-deploy/k3s/apps/portfolio.yaml (see deploy/README.md).
#
# In the `tunispare` namespace so it reuses the existing middlewares and the
# deploy workflow's health wait. It talks to nothing: no database, no API,
# no secret. The image is public on GHCR (nothing in it is private), so it
# needs no pull secret. The NetworkPolicy at the end enforces « talks to
# nothing ».
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: tunispare
  labels: { app: portfolio }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: portfolio }
  template:
    metadata:
      labels: { app: portfolio }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: portfolio
          image: ghcr.io/moanesbbr/potfoliov2
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          volumeMounts:
            # nginx writes its pid and temp files here; the rest is read-only.
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio
  namespace: tunispare
spec:
  selector: { app: portfolio }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# The portfolio is the only pod in this namespace that isn't Tunispare: MySQL
# and the AI reader trust the whole `tunispare` namespace, so it is fenced
# off on its own. It answers Traefik (namespace kube-system) on its port and
# opens no connection at all (nginx serves files: no DNS, no database, no
# API). The kubelet's health probes come from the node and are not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portfolio-isolated
  namespace: tunispare
spec:
  podSelector:
    matchLabels: { app: portfolio }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 8080
  egress: []
